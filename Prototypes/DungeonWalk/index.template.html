<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NLI 地牢拼接与行走测试</title><style>body{margin:0;background:#142b38;color:#f5e7c7;font:16px/1.6 system-ui}main{max-width:1160px;margin:auto;padding:20px}h1{color:#e6bf70}button,select,input{font:inherit;margin:5px;padding:8px}canvas{max-width:100%;background:#25343d;border:1px solid #9b845c}#stage{touch-action:none}label{white-space:nowrap}.tools{background:#243e4a;padding:10px}a{color:#edc980}</style><main><h1>地牢基础套件＋主角行走循环测试</h1><div class="tools"><label>房间 <select id="layout"><option value="hall">战斗大厅</option><option value="elbow">L 形回廊</option><option value="puzzle">机关房</option></select></label><button id="door">切换门状态</button><button id="collision">碰撞格</button><button id="play">动作演示</button><button id="step">下一帧</button><label>帧率<input id="fps" type="range" min="2" max="14" value="8"></label><label>背景<select id="background"><option value="dark">深色</option><option value="light">浅色</option><option value="checker">棋盘格</option></select></label></div><p>方向键/WASD 移动 · E 推动木箱（靠近并朝向木箱）· 木箱压住压力板后开门。当前动画测试仅向右行走，其他方向移动仍保留该朝向。停止移动会回到静止帧；“动作演示”可单独播放循环。此页可离线打开。</p><canvas id="stage" width="1120" height="780" tabindex="0"></canvas><p id="status"></p><h2>逐帧与脚底锚点</h2><canvas id="frames" width="1120" height="240"></canvas><p id="qa"></p><a href="../../Assets/NLI_Prototype_Kit/Documentation/manifest.json">模块、帧区域和坐标清单</a> · <a href="../../Assets/NLI_Prototype_Kit/README.md">使用与验收说明</a></main><script src="kit-data.js"></script><script src="preview.js"></script></html>
