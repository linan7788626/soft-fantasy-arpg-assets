const $=s=>document.querySelector(s), grid=$('#grid'), dialog=$('#detail');
const groupNames={Characters:'角色',Enemies:'怪物',Boss:'首领',VFX:'特效',Items:'道具',UI:'界面',Environment:'环境与建筑'};
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let compare=false;
const isReady=e=>e.retained||(e.new&&e.review==='reviewed');
const statusText=e=>e.retained?'基准保留':!e.new?'待制作':e.review==='reviewed'?(e.addition?'新增 · 已检查':'已检查'):/repair|correction/.test(e.review||'')?'返修中':'待检查';
const assetTitle=e=>e.display_name_zh?`${e.display_name_zh} · ${e.name}`:e.name;
const imageLabel=e=>e.retained?'已认可':e.addition?'新增素材':'升级版';
for(const item of catalog.references){const img=document.createElement('img');img.src=item.src;img.alt=item.name;$('#references').append(img);}
for(const [value,label] of Object.entries(groupNames)){const opt=document.createElement('option');opt.value=value;opt.textContent=label;$('#category').append(opt);}
const additionsNote=catalog.addition_count?`，新增 ${catalog.addition_count} 项素材`:'';
$('#intro').textContent=catalog.complete?`${catalog.done} 项旧素材已逐项重绘，${catalog.retained_count} 项已认可素材保留${additionsNote}。`:`全量重绘进行中：${catalog.done} / ${catalog.legacy_count} 项已生成，另保留 ${catalog.retained_count} 项已认可素材${additionsNote}。`;
$('#footer').textContent='风格 NL-ARPG-SOFT-766DF2B7。新版图像保留生成文件原始像素与 Alpha；旧版图像仅供对照。角色动作连续性、地形无缝拼接和 Unity 导入不因美术重绘而自动视为通过。';
function pane(src,label,old=false){return `<div class="pane ${old?'old-pane':''}"><span class="pane-label">${label}</span><div class="stage">${src?`<img loading="lazy" src="${escapeText(src)}" alt="${escapeText(label)}">`:'<span class="placeholder">待重绘</span>'}</div></div>`;}
function render(){const q=$('#search').value.trim().toLowerCase(), group=$('#category').value, status=$('#status').value;const list=catalog.assets.filter(e=>(!q||(e.name+' '+(e.display_name_zh||'')+' '+e.category+' '+(groupNames[e.group]||'')).toLowerCase().includes(q))&&(!group||e.group===group)&&(!status||(status==='ready'?isReady(e):!isReady(e))));grid.replaceChildren();
for(const e of list){const card=document.createElement('article');card.className='card'+(!e.old?' no-old':'');card.innerHTML=`<div class="images">${e.old?pane(e.old,'旧版',true):''}${pane(e.new,imageLabel(e))}</div><div class="info"><h2>${escapeText(assetTitle(e))}</h2><div class="meta"><span>${escapeText(groupNames[e.group]||e.group)}${e.size?' · '+e.size.join('×'):''}</span><span class="status ${isReady(e)?'':'pending'}">${statusText(e)}</span></div></div>`;card.querySelectorAll('.stage img').forEach(img=>{img.tabIndex=0;img.addEventListener('click',()=>show(e));img.addEventListener('keydown',event=>{if(event.key==='Enter')show(e);});});grid.append(card);}
if(!list.length)grid.innerHTML='<p class="empty">没有匹配的素材。试试清空搜索或切换分类。</p>';$('#count').textContent=`显示 ${list.length} / ${catalog.assets.length} 项 · 已重绘 ${catalog.done} / ${catalog.legacy_count} 项${catalog.addition_count?' · 新增 '+catalog.addition_count+' 项':''}`;}
function show(e){$('#detail-title').textContent=assetTitle(e);$('#detail-images').innerHTML=(e.old?pane(e.old,'旧版',true):'')+pane(e.new,imageLabel(e));$('#detail-images').classList.add('compare');$('#download').hidden=!e.new;$('#download').href=e.new||'#';$('#source-link').hidden=!e.source;$('#source-link').href=e.source||'#';$('#source-link').textContent=e.addition?'查看生成原图':'查看原始参考';$('#record-link').hidden=!e.record;$('#record-link').href=e.record||'#';$('#detail-note').textContent=e.note||'原生透明 PNG；请在不同背景下检查边缘。';dialog.showModal();}
$('#new-view').onclick=()=>setView(false);$('#compare-view').onclick=()=>setView(true);function setView(value){compare=value;document.body.classList.toggle('compare',value);$('#new-view').setAttribute('aria-pressed',String(!value));$('#compare-view').setAttribute('aria-pressed',String(value));}
document.querySelectorAll('.bg').forEach(b=>b.onclick=()=>{document.body.classList.remove('light','dark','checker');document.body.classList.add(b.dataset.bg);document.querySelectorAll('.bg').forEach(other=>other.setAttribute('aria-pressed',String(other===b)));});
$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);$('#status').addEventListener('change',render);$('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});render();
</script>
</body></html>
